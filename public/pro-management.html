<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Progress Pro</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      background: #1f252c;
      color: #ffffff;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    body {
      padding: 0;
    }

    #app {
      width: 100%;
    }

    .pro-management {
      width: 100%;
    }

    .pm-header {
      padding: 20px 22px 18px;
      background: linear-gradient(110deg, #203d79 0%, #20184f 100%);
    }

    .pm-header-top {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .pm-icon {
      flex: 0 0 auto;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: #2161f5;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
    }

    .pm-icon svg {
      display: block;
    }

    .pm-eyebrow {
      margin: 0 0 2px;
      color: #8fc0ff;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .pm-title {
      margin: 0;
      font-size: 17px;
      font-weight: 700;
    }

    .pm-sub {
      margin: 10px 0 0;
      color: #b8c3d5;
      font-size: 12.5px;
      line-height: 1.5;
    }

    .pm-actions {
      padding: 8px 10px;
    }

    .pm-action {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: left;
      padding: 11px 8px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #ffffff;
      cursor: pointer;
      font-family: inherit;
    }

    .pm-action:hover {
      background: rgba(255, 255, 255, 0.06);
    }

    .pm-action-icon {
      flex: 0 0 auto;
      color: #9da7b5;
      display: flex;
    }

    .pm-action-text {
      flex: 1;
      min-width: 0;
    }

    .pm-action-label {
      display: block;
      font-size: 13.5px;
      font-weight: 600;
    }

    .pm-action-desc {
      display: block;
      margin-top: 1px;
      font-size: 11.5px;
      color: #9da7b5;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .pm-action-chevron {
      flex: 0 0 auto;
      color: #6b7484;
      display: flex;
    }

    .pm-footer {
      border-top: 1px solid rgba(255, 255, 255, 0.09);
      padding: 12px 18px 16px;
    }

    .pm-cancel {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px;
      border: 1px solid rgba(255, 120, 120, 0.2);
      border-radius: 8px;
      background: rgba(255, 80, 80, 0.06);
      color: #ff8a8a;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }

    .pm-cancel:hover {
      background: rgba(255, 80, 80, 0.12);
    }

    .pm-cancel[disabled],
    .pm-action[disabled] {
      opacity: 0.6;
      cursor: wait;
    }
  </style>
</head>

<body>

  <div id="app">
    Loading...
  </div>

  <script src="https://p.trellocdn.com/power-up.min.js"></script>
  <script src="config.js"></script>
<script src="subscription.js"></script>
<script src="pro-management.js"></script>
</body>
</html>
