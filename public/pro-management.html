<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Progress Pro</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #1f252c;
      color: #ffffff;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
    }

    #app {
      width: 100%;
    }

    .pro-management {
      width: 100%;
      text-align: center;
    }

    .pro-icon {
      font-size: 42px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0;
      font-size: 26px;
      font-weight: 700;
    }

    p {
      margin: 10px 0 24px;
      color: #aeb7c2;
      font-size: 14px;
    }

    .pro-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .pro-actions button {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.06);
      color: #ffffff;
      font-size: 14px;
      cursor: pointer;
    }

    .pro-actions button:hover {
      background: rgba(255, 255, 255, 0.12);
    }
  </style>
</head>

<body>

  <div id="app">
    Loading...
  </div>

  <script src="https://p.trellocdn.com/power-up.min.js"></script>
<script src="subscription.js"></script>
<script src="pro-management.js"></script>
</body>
</html>
